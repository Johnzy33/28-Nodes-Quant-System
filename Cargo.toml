[workspace]
resolver = "3"
members = [
  "data_engine",
  "prediction_engine",
  "order_engine",
  "main_app", 
  "database_engine", 
  "shared_models", 
  "risk_engine",
]

[workspace.dependencies]
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-0_8"] } # Added with-uuid-0_8
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["alloc", "serde"] }
serde_json = "1.0"
anyhow = "1.0.100"
csv-async = {version = "1.3", features = ["tokio-io"]}
tokio-util = {version = "0.7", features = ["full"]}
futures-util = "0.3.31"
rdkafka = { version = "0.29.0", features = ["ssl", "tokio","default"] }
csv = "1.2"
deadpool-postgres = { version = "0.14.1", features = [ "serde", "rt_tokio_1"] } # Added rt_tokio_1
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
chrono-tz = "0.10.4"
futures = "0.3"
clap = { version = "4.4", features = ["derive", "env"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
inquire = "0.6"
crossterm = "0.27"
ratatui = "0.29.0"
strum_macros = "0.27.2"
strum = "0.27.2"
lazy_static = "1.4"
zmq = "0.10.0"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
async-trait = "0.1.68"
dashmap = "6.1.0"
clokwerk = "0.4.0"

