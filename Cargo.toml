[workspace]
resolver = "3"
members = [
  "data_engine",
  "prediction_engine",
  "order_engine",
  "main_app", "database_engine", "shared_models",
]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
surrealdb = "2.3.10"
chrono = { version = "0.4", features = ["alloc", "serde"] }
serde_json = "1.0"
anyhow = "1.0"
csv-async = {version = "1.3", features = ["tokio-io"]}
tokio-util = {version = "0.7", features = ["full"]}
futures-util = "0.3.31"
